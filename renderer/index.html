<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:;" />
  <title>QingStorClient</title>
  <link rel="stylesheet" href="css/app.css" />
</head>
<body>
  <!-- 顶栏 -->
  <header id="topbar">
    <div class="brand">
      <div class="brand-logo">Q</div>
      <div class="brand-text">
        <div class="brand-name">QingStorClient</div>
        <div class="brand-sub" id="brandBucket">未连接</div>
      </div>
    </div>
    <div class="top-actions">
      <button class="icon-btn" id="btnSettings" title="连接设置">⌁</button>
    </div>
  </header>

  <!-- 主体：左目录树 + 右文件区 -->
  <div id="mainRow">
    <aside id="treePanel" aria-label="目录树">
      <div class="tree-head">
        <span class="tree-title">目录</span>
        <button class="mini-btn" id="btnTreeRefresh" title="刷新目录树">↻</button>
        <button class="mini-btn" id="btnTreeCollapse" title="收起目录树">«</button>
      </div>
      <div id="treeBody" class="tree-body"></div>
    </aside>

    <div id="treeSplitter" class="tree-splitter" title="拖动调整宽度"></div>
    <button id="btnTreeExpand" class="tree-expand-btn hidden" title="展开目录树">»</button>

    <main id="fileArea">
      <!-- 工具栏 -->
      <div id="toolbar">
        <button class="tb-btn" id="btnUp" title="返回上一级 (Backspace)"><span class="ic">↑</span>上级</button>
        <div class="tb-sep"></div>
        <button class="tb-btn" id="btnUploadFiles" title="上传文件 (Ctrl+U)"><span class="ic">⤒</span>上传文件</button>
        <button class="tb-btn" id="btnUploadFolder" title="上传文件夹 (Ctrl+Shift+U)"><span class="ic">⇪</span>上传文件夹</button>
        <div class="tb-sep"></div>
        <button class="tb-btn" id="btnDownload" title="下载选中项"><span class="ic">⤓</span>下载</button>
        <button class="tb-btn" id="btnNewFolder" title="新建文件夹 (Ctrl+N)"><span class="ic">＋</span>新建文件夹</button>
        <button class="tb-btn danger" id="btnDelete" title="删除选中项 (Delete)"><span class="ic">✕</span>删除</button>
        <div class="tb-spacer"></div>
        <div class="tb-search" title="按名称前缀搜索当前目录（S3 Prefix 语义，搜不到名字中间的关键词）">
          <span class="tb-search-ic">⌕</span>
          <input id="searchInput" type="text" spellcheck="false" placeholder="搜索当前目录" />
          <button id="btnSearchClear" class="tb-search-clear hidden" title="清空搜索">✕</button>
        </div>
        <button class="tb-btn" id="btnRefresh" title="刷新 (F5)"><span class="ic">↻</span>刷新</button>
      </div>

      <!-- 层级路径 + 分页条 -->
      <div id="pathBar" class="path-bar">
        <nav id="breadcrumb" class="breadcrumb-bar" aria-label="目录位置"></nav>
        <div id="pager" class="pager hidden">
          <button class="mini-btn" id="btnPrevPage" title="上一页">‹ 上一页</button>
          <span id="pageLabel" class="page-label">第 1 页</span>
          <button class="mini-btn" id="btnNextPage" title="下一页">下一页 ›</button>
        </div>
      </div>

      <!-- 文件区 -->
      <div class="table-head">
        <label class="cell-check"><input type="checkbox" id="checkAll" /></label>
        <div class="cell-name sortable" data-sort="name" title="排序（仅当前页）">名称<span class="sort-ind"></span></div>
        <div class="cell-size sortable" data-sort="size" title="排序（仅当前页）">大小<span class="sort-ind"></span></div>
        <div class="cell-time sortable" data-sort="time" title="排序（仅当前页）">修改时间<span class="sort-ind"></span></div>
      </div>
      <div id="tableBody" class="table-body" tabindex="0"></div>
      <div id="loadingMask" class="loading-mask hidden">
        <div class="spinner"></div>
        <div class="mask-text">正在加载目录…</div>
      </div>
      <div id="dropOverlay" class="drop-overlay hidden">
        <div class="drop-box">松开鼠标上传到当前目录</div>
      </div>
    </main>
  </div>

  <!-- 传输面板 -->
  <section id="transferPanel" class="collapsed">
    <div id="transferHeader" class="transfer-header">
      <div class="th-left">
        <span class="th-caret" id="transferCaret">▸</span>
        <span>传输管理</span>
        <span class="th-badge" id="transferBadge">0</span>
      </div>
      <button class="mini-btn" id="btnClearTransfers">清理已完成</button>
    </div>
    <div id="transferList" class="transfer-list"></div>
  </section>

  <!-- 状态栏 -->
  <footer id="statusbar">
    <span id="statLeft">就绪</span>
    <span class="spacer"></span>
    <span id="statChannel" class="channel-badge" title="切换更新渠道">stable</span>
    <span id="statVersion"></span>
  </footer>

  <!-- 弹窗根 -->
  <div id="modalRoot"></div>
  <!-- 右键菜单根 -->
  <div id="ctxRoot"></div>
  <!-- 轻提示根 -->
  <div id="toastRoot"></div>

  <!--
    文件类型图标集：由 fileicon.js 以 <use href="#ico-xxx"> 引用。
    放在同一文档内，不占用 img-src，也不产生额外网络请求。
  -->
  <svg id="iconDefs" width="0" height="0" style="position:absolute" aria-hidden="true">
    <symbol id="ico-dir" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
      <path d="M3 8.5A2.5 2.5 0 0 1 5.5 6h3.2l1.8 2h7.5A2.5 2.5 0 0 1 21 10.5v6A2.5 2.5 0 0 1 18.5 19h-13A2.5 2.5 0 0 1 3 16.5z" />
    </symbol>
    <symbol id="ico-image" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
      <rect x="3" y="4" width="18" height="16" rx="2.5" />
      <circle cx="8.6" cy="9.6" r="1.5" />
      <path d="M4 17.5l4.8-4.8 3.7 3.7 2.6-2.2L20 18" />
    </symbol>
    <symbol id="ico-video" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
      <rect x="3" y="5" width="18" height="14" rx="2.5" />
      <path d="M10.4 9.4l4.6 2.8-4.6 2.8z" />
    </symbol>
    <symbol id="ico-audio" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
      <path d="M9.5 17.4V6.2l9-1.7v11" />
      <circle cx="6.8" cy="17.6" r="2.7" />
      <circle cx="15.8" cy="15.6" r="2.7" />
    </symbol>
    <symbol id="ico-doc" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
      <path d="M6.5 3h6.6L18 7.9V20a1 1 0 0 1-1 1H6.5a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1z" />
      <path d="M13 3v5h5" />
      <path d="M8.6 12.6h7M8.6 16h4.8" />
    </symbol>
    <symbol id="ico-sheet" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
      <path d="M6.5 3h6.6L18 7.9V20a1 1 0 0 1-1 1H6.5a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1z" />
      <path d="M13 3v5h5" />
      <path d="M8.4 12.4h7.2M8.4 16h7.2M12 12.4V18" />
    </symbol>
    <symbol id="ico-slide" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
      <rect x="3" y="4" width="18" height="12" rx="2" />
      <path d="M12 16v3.4M8.4 20.4h7.2" />
    </symbol>
    <symbol id="ico-pdf" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
      <path d="M6.5 3h6.6L18 7.9V20a1 1 0 0 1-1 1H6.5a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1z" />
      <path d="M13 3v5h5" />
      <rect x="8" y="13" width="7.4" height="4.6" rx="1" />
    </symbol>
    <symbol id="ico-archive" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
      <rect x="3.5" y="3.5" width="17" height="17" rx="2" />
      <path d="M12 3.5v2M12 7.6v2M12 11.7v2M12 15.8v2" />
    </symbol>
    <symbol id="ico-code" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
      <path d="M6.5 3h6.6L18 7.9V20a1 1 0 0 1-1 1H6.5a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1z" />
      <path d="M13 3v5h5" />
      <path d="M10.2 12.2L8.2 14.8l2 2.6M14 12.2l2 2.6-2 2.6" />
    </symbol>
    <symbol id="ico-text" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
      <path d="M6.5 3h6.6L18 7.9V20a1 1 0 0 1-1 1H6.5a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1z" />
      <path d="M13 3v5h5" />
      <path d="M8.6 12.2h7M8.6 15h7M8.6 17.8h4.4" />
    </symbol>
    <symbol id="ico-exe" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
      <rect x="3" y="3.5" width="18" height="17" rx="2.5" />
      <path d="M12 7.8v6.2M9.2 11.4l2.8 2.8 2.8-2.8" />
      <path d="M8 17h8" />
    </symbol>
    <symbol id="ico-font" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
      <rect x="3" y="3.5" width="18" height="17" rx="2.5" />
      <path d="M8.4 16.6l3.6-9 3.6 9M9.8 13.6h4.4" />
    </symbol>
    <symbol id="ico-other" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
      <path d="M6.5 3h6.6L18 7.9V20a1 1 0 0 1-1 1H6.5a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1z" />
      <path d="M13 3v5h5" />
    </symbol>
  </svg>

  <script type="module" src="js/main.js"></script>
</body>
</html>
