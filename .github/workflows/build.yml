name: 跨平台构建

# 仅手动触发：推送后在 GitHub 仓库的 Actions 页面点 "Run workflow" 执行
on:
  workflow_dispatch:
    inputs:
      version:
        description: "构建版本号（仅用于产物命名标识）"
        required: false
        default: "latest"

jobs:
  build:
    name: 构建 ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: qingstor-client-windows
          - os: macos-latest
            artifact: qingstor-client-macos
          - os: ubuntu-latest
            artifact: qingstor-client-linux

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 安装依赖与 PyInstaller
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: 安装 Linux 运行时依赖
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libxcb-cursor0 libxcb-xinerama0

      - name: 构建（Windows 单文件）
        if: matrix.os == 'windows-latest'
        run: pyinstaller --noconfirm --clean --windowed --onefile --name qingstor-client main.py

      - name: 构建（macOS .app）
        if: matrix.os == 'macos-latest'
        run: pyinstaller --noconfirm --clean --windowed --name qingstor-client main.py

      - name: 构建（Linux 单文件）
        if: matrix.os == 'ubuntu-latest'
        run: pyinstaller --noconfirm --clean --windowed --onefile --name qingstor-client main.py

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}-${{ github.event.inputs.version || 'latest' }}
          path: |
            dist/qingstor-client*
          if-no-files-found: error
