# =====================================================================
# qingStorClient 更新服务 · docker compose
# ---------------------------------------------------------------------
# 运行参数全部集中在同目录的 .env（模板见 .env.example）：
#   cp .env.example .env && vi .env && docker compose up -d
#
# 下面每处 ${VAR:-默认值} 都是「.env 优先、缺省回落」。所以 .env 不存在也能启动，
# 会按默认值跑，默认值就等于此前硬编码在这里的那套配置。
#
# 关键点：两个端口都只发布到宿主机回环地址。
#   - ${PORT}        给同机的 nginx 反代（proxy_pass http://127.0.0.1:8789）
#   - ${ADMIN_PORT}  只给你自己的 SSH 隧道（ssh -L 8790:127.0.0.1:8790）
#
# 默认端口刻意避开 8787/8788：同机上可能已经跑着 myApiTools 的服务端（占 8787），
# 撞了以后 publicServer 监听失败会 process.exit(1)，整个容器起不来。
# server.js 的代码默认值仍是 8787/8788，这里用环境变量覆盖。
#
# 写成 "127.0.0.1:8789:8789" 而不是 "8789:8789" 是故意的：
# 后者相当于 docker 直接监听 0.0.0.0，绕过 ufw 把端口暴露到公网 ——
# 这是 docker 用户最常踩的坑之一，iptables 规则会被 DOCKER 链提前接管。
# =====================================================================

services:
  update:
    # =================================================================
    # 镜像来源：二选一
    # -----------------------------------------------------------------
    # 方案 A · 本地构建（当前启用）
    #   改了 server/ 代码后：docker compose up -d --build
    #
    # 方案 B · 拉取已发布镜像（服务器上不需要源码和构建工具链）
    #   做法：把下面 build / image 两行整个删掉，换成下面任意一行，
    #        然后 docker compose pull && docker compose up -d
    #
    #   阿里云 ACR —— 境内 ECS 首选，Docker Hub 经常拉不动
    #     image: registry.cn-hangzhou.aliyuncs.com/myzhouye/qingstorclient-server:1.3.0
    #
    #   Docker Hub —— 境外或备选
    #     image: myzhouye/qingstorclient-server:1.3.0
    #
    #   tag 建议写固定版本号而不是 latest：docker images 能看出线上跑的是哪版，
    #   回滚只需改这一行。latest 会跟着 docker-publish 一起动，事后无法追溯。
    # =================================================================
    build: .
    image: qingstorclient-server:latest
    container_name: qs-update
    restart: unless-stopped

    ports:
      # 左右两侧都取同一个变量：改 .env 里的 PORT 一处就够，不会出现
      # 「映射到 8789 但容器内还听 8787」这种对不上的情况。
      - "127.0.0.1:${PORT:-8789}:${PORT:-8789}"          # 更新 API → nginx
      - "127.0.0.1:${ADMIN_PORT:-8790}:${ADMIN_PORT:-8790}"  # 管理端 → 只走 SSH 隧道

    environment:
      # ---- 监听 ----
      # 容器内必须绑 0.0.0.0，否则端口映射进不来；
      # 真正的隔离靠上面宿主机侧的 127.0.0.1 绑定，不是靠这里改 127.0.0.1。
      PORT: "${PORT:-8789}"
      ADMIN_PORT: "${ADMIN_PORT:-8790}"
      HOST: "${HOST:-0.0.0.0}"
      ADMIN_HOST: "${ADMIN_HOST:-0.0.0.0}"

      # ---- 对外访问 ----
      # 填了以后 latest 接口返回绝对 downloadUrl（https://域名/api/releases/download/12）；
      # 留空则只返回相对路径 /api/...
      # ⚠️ 填你自己的更新服务域名，不要填对象存储域名，也不要留着 example 占位带上线。
      PUBLIC_ORIGIN: "${PUBLIC_ORIGIN:-}"
      TRUST_PROXY: "${TRUST_PROXY:-1}"

      # ---- 发布 ----
      RELEASE_MAX_MB: "${RELEASE_MAX_MB:-300}"
      RELEASE_CHANNEL: "${RELEASE_CHANNEL:-stable}"

      # ---- 管理端 ----
      # 容器内来自网桥网关（172.17.0.1 之类）的请求不是回环地址，
      # 需要在这里声明受信网段，否则管理端会一律拒绝。
      ADMIN_ALLOW_CIDR: "${ADMIN_ALLOW_CIDR:-172.16.0.0/12}"
      # 令牌一般不写在这里：让它自动生成到 data/admin-token.txt，
      # 首次启动后 `docker exec qs-update cat /app/data/admin-token.txt` 取。
      ADMIN_TOKEN: "${ADMIN_TOKEN:-}"
      # 设 1 则整个管理侧不启动（纯公网部署、不开隧道时用）。
      ADMIN_DISABLED: "${ADMIN_DISABLED:-}"

      # ---- 存储 ----
      # local（默认）= 安装包写 /app/data/releases
      # s3           = 安装包写对象存储，本地库只记元信息，下载时现签临时地址
      # 切换驱动不影响存量包：每条记录自带 storage 字段，按行走各自的驱动，
      # 所以从 local 切到 s3 之后，之前发在本地盘上的包仍然能下载。
      #
      # ⚠ S3_ENDPOINT 必须是 S3 协议端点（形如 https://s3.<region>.<vendor>），
      #   不是厂商控制台里那个不带 s3 的网页直链域名 —— 后者只认原生签名，会 401。
      STORAGE_DRIVER: "${STORAGE_DRIVER:-local}"
      S3_ENDPOINT: "${S3_ENDPOINT:-}"
      S3_PUBLIC_ENDPOINT: "${S3_PUBLIC_ENDPOINT:-}"
      S3_BUCKET: "${S3_BUCKET:-}"
      S3_REGION: "${S3_REGION:-}"
      S3_ACCESS_KEY: "${S3_ACCESS_KEY:-}"
      S3_SECRET_KEY: "${S3_SECRET_KEY:-}"
      S3_PREFIX: "${S3_PREFIX:-}"
      S3_ALLOW_ROOT: "${S3_ALLOW_ROOT:-}"
      S3_FORCE_PATH_STYLE: "${S3_FORCE_PATH_STYLE:-true}"
      S3_SIGN_EXPIRES: "${S3_SIGN_EXPIRES:-300}"

    volumes:
      - ./data:/app/data

    # 只读根文件系统：容器被攻破也改不了自己的代码。
    # /app/data 是唯一可写卷，/tmp 留给 node 运行时。
    read_only: true
    tmpfs:
      - /tmp

    security_opt:
      - no-new-privileges:true

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
