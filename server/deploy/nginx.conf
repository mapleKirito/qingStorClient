# =====================================================================
# qingStorClient 更新服务 · nginx 配置示例
# ---------------------------------------------------------------------
# 设计原则：公网入口只认四个路径 —— 根路径自述、健康检查、查最新版、下载安装包。
# 其余一律 404，包括 /admin 与 /api/admin/*。
#
# 注意管理端根本不是靠这段配置拦的：默认配置下管理端监听在服务端的
# 127.0.0.1:8790，nginx 之外没有任何端口对外开放，公网侧连都连不上。
# 这段配置只是把「公网这一侧」收窄到只剩更新 API。
#
# 使用前替换：
#   update.example.com  → 你的域名
#   ssl_certificate     → 你的证书路径
#   qs_update 上游       → 服务端实际地址（裸机 127.0.0.1:8789 / 容器 127.0.0.1:8789）
#
# 端口说明：8789 而不是 nginx 惯例的 8787，是为了避开同机上 myApiTools
# 服务端已占用的 8787。两个服务各用各的子域、各用各的端口，互不影响。
# =====================================================================

upstream qs_update {
    server 127.0.0.1:8789;
    keepalive 8;
}

# HTTP 一律跳 HTTPS：更新 API 不走明文
server {
    listen 80;
    listen [::]:80;
    server_name update.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name update.example.com;

    ssl_certificate     /etc/letsencrypt/live/update.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/update.example.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:QSUpdate:10m;

    access_log /var/log/nginx/qs-update.access.log;
    error_log  /var/log/nginx/qs-update.error.log warn;

    # 公网入口不接受任何上传：更新 API 全是只读的 GET，所以故意卡在 1m。
    # 这样即使有人摸到发布接口，也传不上一个字节。
    client_max_body_size 1m;

    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection        "";

    # ---- 0. 根路径自述：浏览器敲域名时确认服务活着、版本多少 ----
    # 只返回 name / version / scope / serverTime 这类身份信息，
    # 发布数量与运行时长在 /api/health，故意不放这里。
    # 用 = 精确匹配，优先级高于底部的 location /（那是 return 404）。
    location = / {
        proxy_pass http://qs_update;
        proxy_cache off;
        add_header Cache-Control "no-store" always;
        access_log off;
    }

    # ---- 1. 健康检查：给监控 / 探活用 ----
    location = /api/health {
        proxy_pass http://qs_update;
        access_log off;
    }

    # ---- 2. 查最新版本 ----
    location = /api/releases/latest {
        proxy_pass http://qs_update;
        # 更新检查是低频请求，但也不该被缓存：渠道一发布就要立刻生效
        proxy_cache off;
        add_header Cache-Control "no-store" always;
    }

    # ---- 3. 下载安装包（唯一会传大文件的路由）----
    # 用正则限定只放行数字 ID，避免 /api/releases/download/../../etc/passwd
    # 这类路径穿越打到上游。
    location ~ ^/api/releases/download/[0-9]+$ {
        proxy_pass http://qs_update;

        # 关掉缓冲：nginx 不要先把整个安装包收进临时文件再转发，
        # 否则每个下载都会在服务器磁盘上多写一份 100MB。
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_max_temp_file_size 0;

        # 弱网下下载 100MB 可能远超默认 60s
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;

        # 安装包本身已是压缩格式，再 gzip 纯属浪费 CPU
        gzip off;

        # 支持断点续传（上游已返回 Accept-Ranges / 206）
        proxy_set_header Range $http_range;
        proxy_set_header If-Range $http_if_range;
    }

    # ---- 4. 其余一切：404 ----
    # 管理端不在这个 server 里，任何路径都到不了它。
    # 公网例外只有上面 4 条 location（/、/api/health、latest、download），均已单独列出。
    location / {
        return 404;
    }
}

# =====================================================================
# 千万不要做的事（写在这里当护栏）
# ---------------------------------------------------------------------
# ❌ 不要给 admin 端口加 location，例如：
#      location /admin { proxy_pass http://127.0.0.1:8790; }
#    加了就等于把管理端放到公网。服务端虽然会识别 X-Forwarded-* 头并拒绝，
#    但这属于最后一道兜底，不是可以依赖的设计。
#
#    正确做法：在你自己电脑上开隧道，直接访问本地 8790
#      ssh -N -L 8790:127.0.0.1:8790 user@server
#    然后浏览器打开 http://127.0.0.1:8790/admin
#
# ❌ 不要把 8790 写进防火墙放行规则、安全组、或者 docker 的 0.0.0.0 映射。
# =====================================================================
